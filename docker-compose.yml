services:
  api:
    build: .
    container_name: brightloop_billing_engine
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./brightloop.db
      - SECRET_KEY=brightloop-hackathon-secret-jwt-key-2026-prod-secure
      - ALGORITHM=HS256
      - JWT_SECRET_KEY=brightloop-hackathon-secret-jwt-key-2026-prod-secure
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
    volumes:
      - .:/app
    restart: unless-stopped
